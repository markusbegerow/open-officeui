name: Release

# Push a tag like v1.0.1 (after bumping "version" in package.json and VERSION in
# packages/ui/src/AboutTab.tsx). Attaches the production manifests to a GitHub release.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Tag must match the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: npm run typecheck
      # includes a test that VERSION in AboutTab.tsx matches package.json
      - run: npm test
      # SITE_URL must match what the Pages workflow deploys, or the manifests point to the wrong place
      - run: npm run build:site
        env:
          SITE_URL: ${{ vars.SITE_URL }}

      - name: Zip the manifests
        run: (cd site/manifests && zip -q ../../open-officeui-manifests.zip *.xml)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            open-officeui-manifests.zip site/manifests/*.xml
