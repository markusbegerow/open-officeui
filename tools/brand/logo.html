<!doctype html>
<meta charset="utf-8" />
<title>Open OfficeUI logo</title>
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  /* the sibling mark only fills the middle band of its canvas, so zoom in a little */
  #logo { position: relative; width: var(--s); height: var(--s); transform: scale(1.15); transform-origin: 50% 50%; }
  #logo > * { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
<div id="logo">
  <img id="mark" src="../../assets/logo/open-desktopui-master-1024.png" alt="" />
  <svg id="badge" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#4a1fff" />
        <stop offset="1" stop-color="#00dcc4" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1b4d" flood-opacity="0.35" />
      </filter>
    </defs>
    <!-- document page with folded corner -->
    <path filter="url(#shadow)" fill="#ffffff" stroke="#d5dbea" stroke-width="6"
      d="M708 600 H840 L910 670 V872 a28 28 0 0 1 -28 28 H708 a28 28 0 0 1 -28 -28 V628 a28 28 0 0 1 28 -28 Z" />
    <path fill="#e6eaf5" d="M840 600 L910 670 H868 a28 28 0 0 1 -28 -28 Z" />
    <rect x="712" y="722" width="170" height="24" rx="12" fill="url(#g)" />
    <rect x="712" y="776" width="170" height="24" rx="12" fill="url(#g)" opacity="0.8" />
    <rect x="712" y="830" width="108" height="24" rx="12" fill="url(#g)" opacity="0.6" />
  </svg>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.style.setProperty("--s", `${q.get("s") || 1024}px`);
  if (q.get("badge") === "0") document.getElementById("badge").remove();
</script>
